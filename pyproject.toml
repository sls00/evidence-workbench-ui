[project]
name = "evidence-workbench"
version = "0.1.0"
description = "Evidence Workbench — local orchestrator UI for synth-fin + ai-mrg-bench"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BlueOak-1.0.0" }
authors = [{ name = "Steven L. Sorenson" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.scripts]
evidence-workbench = "evidence_workbench.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_workbench"]

# Engines are NOT installed into this env: synth-fin (pandas>=3) and workbench
# (aequitas→pandas<3) conflict. Runners invoke `uv run --directory <root> …`
# against sibling checkouts discovered via SYNTH_FIN_ROOT / AI_MRG_BENCH_ROOT.

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: real engines when roots/LFS present",
]
